name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    # The environment holds the reviewer gate: the job waits for approval before it builds or publishes.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
      - name: Build the app
        env:
          TAG: ${{ github.ref_name }}
        run: CONFIG=release VERSION="${TAG#v}" ./Scripts/make-app.sh
      - name: Package and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ditto -c -k --keepParent build/Boto.app "Boto-${TAG#v}.zip"
          shasum -a 256 "Boto-${TAG#v}.zip" > "Boto-${TAG#v}.zip.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Boto-*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          # The notes carry a Portuguese copy under the English text.
          awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.pt-BR.md > notes-pt.md
          test -s notes-pt.md || { echo "CHANGELOG.pt-BR.md has no section for ${TAG#v}"; exit 1; }
          { echo; echo "---"; echo; echo "## Em português"; cat notes-pt.md; } >> notes.md
          gh release create "$TAG" "Boto-${TAG#v}.zip" "Boto-${TAG#v}.zip.sha256" --verify-tag --title "Boto ${TAG#v}" --notes-file notes.md
